<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plural Stack</title>
<meta name="description" content="Plural Stack — a RadicalxChange project. First version coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;450&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F7F9;
    --ink: #1A2238;
    --muted: #5A6377;
    --layer-1: #3A6EA5; /* civic blue */
    --layer-2: #2A7F7A; /* teal */
    --layer-3: #C9972B; /* ochre */
    --layer-4: #7C4D8C; /* plum */
    --layer-5: #C4553B; /* coral */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-weight: 400;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
  }

  /* Signature: the stack itself — five layers, five hues */
  .stack {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 2.5rem;
  }

  .stack span {
    display: block;
    height: 10px;
    border-radius: 2px;
    opacity: 0;
    transform: translateX(-8px);
    animation: settle 0.5s ease-out forwards;
  }

  /* Plural: no layer is the same width, none is on top by rank —
     widths vary without ordering large-to-small */
  .stack span:nth-child(1) { width: 88px;  background: var(--layer-4); animation-delay: 0.05s; }
  .stack span:nth-child(2) { width: 120px; background: var(--layer-2); animation-delay: 0.15s; }
  .stack span:nth-child(3) { width: 72px;  background: var(--layer-5); animation-delay: 0.25s; }
  .stack span:nth-child(4) { width: 104px; background: var(--layer-1); animation-delay: 0.35s; }
  .stack span:nth-child(5) { width: 96px;  background: var(--layer-3); animation-delay: 0.45s; }

  @keyframes settle {
    to { opacity: 1; transform: translateX(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .stack span { animation: none; opacity: 1; transform: none; }
  }

  h1 {
    font-family: "IBM Plex Mono", monospace;
    font-weight: 500;
    font-size: clamp(1.5rem, 4vw, 2.25rem);
    letter-spacing: -0.02em;
    margin-bottom: 1rem;
  }

  h1 .tld { color: var(--muted); font-weight: 400; }

  p.tagline {
    font-size: clamp(1rem, 2.2vw, 1.125rem);
    font-weight: 450;
    color: var(--muted);
    max-width: 34ch;
    line-height: 1.6;
    margin-bottom: 2.5rem;
  }

  a.contact {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.9375rem;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1.5px solid var(--layer-1);
    padding-bottom: 2px;
    transition: border-color 0.15s ease;
  }

  a.contact:hover { border-color: var(--layer-5); }

  a.contact:focus-visible {
    outline: 2px solid var(--layer-1);
    outline-offset: 4px;
    border-radius: 2px;
  }

  footer {
    padding: 1.5rem;
    text-align: center;
    font-size: 0.8125rem;
    color: var(--muted);
  }

  footer a {
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  footer a:focus-visible {
    outline: 2px solid var(--layer-1);
    outline-offset: 2px;
    border-radius: 2px;
  }
</style>
</head>
<body>
<main>
  <div class="stack" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
  <h1>pluralstack<span class="tld">.org</span></h1>
  <p class="tagline">The first version of this site is on its way. In the meantime, we&rsquo;d love to hear from you.</p>
  <a class="contact" href="mailto:hello@pluralstack.org">hello@pluralstack.org</a>
</main>
<footer>
  A project of <a href="https://www.radicalxchange.org">RadicalxChange</a>
</footer>
</body>
</html>
